name: Publish

# Publishes to PyPI when a GitHub Release is published.
#
# Authentication uses PyPI trusted publishing, so no API token is stored in the
# repository. It has to be configured once on PyPI, under the project's
# Publishing settings, with:
#   owner        mihdicaballero
#   repository   mento
#   workflow     publish.yml
#   environment  pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Verify the built version matches the release tag
        if: github.event_name == 'release'
        run: |
          release_tag="${GITHUB_REF_NAME#v}"
          built_version=$(ls dist/*.tar.gz | sed -E 's/.*mento-(.*)\.tar\.gz/\1/')
          echo "Release tag: $release_tag / built version: $built_version"
          if [ "$release_tag" != "$built_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in pyproject.toml ($built_version)"
            exit 1
          fi

      - name: Install the built wheel and import the package
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python -c "import mento; print('mento', mento.__version__)"

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mento/
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
