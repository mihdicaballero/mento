version: "2"

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"

python:
  install:
    # Dependencies come from the [docs] extra in pyproject.toml, so the docs
    # build and the CI docs job install exactly the same set.
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

formats:
  - pdf
