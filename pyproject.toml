[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mento"
version = "0.4.1"
description = "An intuitive tool for structural engineers to design concrete elements efficiently."
readme = "README.md"
authors = [
    {name = "Mehdí Caballero", email = "mihdicaballero@gmail.com"},
    {name = "Juan Pablo Romaris", email="jpromaris@yahoo.com.ar"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]
requires-python = ">=3.10"
keywords = [
    "concrete design",
    "structural engineering",
    "structural analysis",
]

[project.urls]
"Homepage" = "https://github.com/mihdicaballero/mento"

[tool.setuptools]
packages = ["mento", "mento.codes"]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }


[tool.ruff]
extend-exclude = ["build/", "dist/"]
show-fixes = true
line-length = 120

[tool.ruff.lint]
# Pinned explicitly so a new ruff release cannot change the rule set under CI.
# These are the rules ruff enabled by default up to 0.15.x; 0.16 widened the
# defaults to UP, RUF, I, B, RET, PL, SIM and more, which fails on this repo.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
packages = ["mento"]
python_version = "3.10"
strict = true
allow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=mento --cov-report=html --cov-report=term-missing -v"
testpaths = [
    "tests",
]
